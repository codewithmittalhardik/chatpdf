<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | ChatPDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.75);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.2);
            --input-bg: rgba(255, 255, 255, 0.85);
            --input-border: rgba(226, 232, 240, 0.8);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: var(--bg-color);
            transition: background-color 0.4s ease;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            color: var(--text-main);
        }

        .bg-mesh {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(at 10% 10%, rgba(99, 102, 241, 0.18) 0px, transparent 50%),
                radial-gradient(at 90% 20%, rgba(236, 72, 153, 0.15) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(14, 165, 233, 0.16) 0px, transparent 50%);
            z-index: -1;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .input-field {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: var(--text-main);
            transition: all 0.25s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .gradient-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #0284c7 100%);
            background-size: 200% 200%;
            transition: all 0.3s ease;
        }

        .gradient-btn:hover {
            background-position: 100% 0;
            box-shadow: 0 12px 30px -8px rgba(79, 70, 229, 0.35);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="px-4 py-8">

    <div class="bg-mesh"></div>

    <!-- Main Card Container -->
    <div class="w-full max-w-[400px] glass-card rounded-3xl p-8 sm:p-9 relative transition-all duration-300">
        
        <!-- Header -->
        <div class="flex flex-col items-center mb-7 text-center">
            <div class="w-13 h-13 rounded-2xl gradient-btn flex items-center justify-center shadow-lg mb-3.5 p-3">
                <i class="ph-bold ph-lock-key text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Set New Password</h1>
            <p class="text-xs mt-1 text-slate-500">Creating new credentials for <span class="font-semibold text-slate-800">{{ email }}</span></p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-5 p-3.5 rounded-2xl border flex items-center gap-2.5 text-xs font-medium transition-all" 
                         style="background: {% if category == 'error' %}rgba(239, 68, 68, 0.08){% else %}rgba(16, 185, 129, 0.08){% endif %}; 
                                border-color: {% if category == 'error' %}rgba(239, 68, 68, 0.2){% else %}rgba(16, 185, 129, 0.25){% endif %}; 
                                color: {% if category == 'error' %}#dc2626{% else %}#059669{% endif %};">
                        <i class="ph {% if category == 'error' %}ph-warning-circle{% else %}ph-check-circle{% endif %} text-lg shrink-0"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Form -->
        <form action="/reset_password/{{ token }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 ml-1 text-slate-500">New Password</label>
                <div class="relative">
                    <input id="new_password" type="password" name="new_password" placeholder="••••••••" required 
                        class="w-full input-field rounded-2xl px-4 py-3 text-sm placeholder:text-slate-400 pl-11 pr-11">
                    <i class="ph ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400"></i>
                    <button type="button" onclick="togglePassword('new_password', 'toggleIcon1')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-opacity">
                        <i id="toggleIcon1" class="ph ph-eye text-lg"></i>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider mb-2 ml-1 text-slate-500">Confirm New Password</label>
                <div class="relative">
                    <input id="confirm_password" type="password" name="confirm_password" placeholder="••••••••" required 
                        class="w-full input-field rounded-2xl px-4 py-3 text-sm placeholder:text-slate-400 pl-11 pr-11">
                    <i class="ph ph-check-square absolute left-4 top-1/2 -translate-y-1/2 text-lg text-slate-400"></i>
                    <button type="button" onclick="togglePassword('confirm_password', 'toggleIcon2')" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 transition-opacity">
                        <i id="toggleIcon2" class="ph ph-eye text-lg"></i>
                    </button>
                </div>
            </div>

            <button type="submit" 
                class="w-full text-white font-bold py-3.5 rounded-2xl gradient-btn text-sm shadow-xl mt-2 active:scale-[0.98]">
                Update Password
            </button>
        </form>

        <p class="text-center text-xs mt-6 text-slate-500">
            Remembered your password? 
            <a href="/login" class="font-bold text-indigo-600 hover:underline">Log in</a>
        </p>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 glass-card rounded-full shadow-sm">
            <span class="w-2 h-2 rounded-full animate-pulse bg-indigo-500"></span>
            <p class="text-[11px] font-medium tracking-wider uppercase text-slate-500">
                Crafted by <span class="text-indigo-600 font-bold">Hardik Mittal</span>
            </p>
        </div>
    </footer>

    <script>
        function togglePassword(inputId, iconId) {
            const pw = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }
    </script>
</body>
</html>
